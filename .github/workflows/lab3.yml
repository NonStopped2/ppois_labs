name: Lab 3 online store verification

on:
  push:
    branches: [main, feature/lab3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Store tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      CXX: clang++
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Configure isolated sanitizer build
        run: >-
          cmake -S . -B build/lab3-test -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_LAB1=OFF -DBUILD_LAB2=OFF -DLAB3_ENABLE_SANITIZERS=ON
          -DBUILD_SHARED_LIBS=OFF
      - name: Build
        run: cmake --build build/lab3-test --parallel 4
      - name: Run C++ and tooling tests
        run: ctest --test-dir build/lab3-test -L '^lab3-' --no-tests=error --output-on-failure

  quality:
    name: Store coverage and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 cppcheck
          python3 -m pip install clang-format==18.1.8
      - name: Check quality and release routing
        env:
          CXX: clang++-18
        run: |
          python3 lab3/tools/quality.py
          python3 tools/test_release_changes.py
          python3 tools/test_release_workflow.py
      - name: Configure coverage
        run: >-
          cmake -S . -B build/lab3-coverage -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_LAB1=OFF -DBUILD_LAB2=OFF -DLAB3_ENABLE_COVERAGE=ON
          -DCMAKE_CXX_COMPILER=clang++-18 -DBUILD_SHARED_LIBS=OFF
      - name: Build instrumented unit tests
        run: cmake --build build/lab3-coverage --parallel 4
      - name: Enforce strictly more than 90 percent unit line coverage
        run: >-
          python3 lab3/tools/coverage.py --build-dir build/lab3-coverage
          --llvm-cov llvm-cov-18 --llvm-profdata llvm-profdata-18
      - name: Enforce separate JSON and file-store unit coverage
        run: >-
          python3 lab3/tools/coverage.py --build-dir build/lab3-coverage --scope persistence
          --llvm-cov llvm-cov-18 --llvm-profdata llvm-profdata-18
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab3-unit-coverage
          path: build/lab3-coverage/lab3-unit-coverage-*/coverage.json
          if-no-files-found: warn
