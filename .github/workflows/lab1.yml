name: Lab 1 verification and releases

on:
  push:
    branches: [main, 'feature/**']
    tags: ['lab1-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Release
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install, smoke-test and package
        run: python3 tools/package.py --build-dir build --output-dir build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: build/packages/*.tar.gz
          if-no-files-found: error

  quality:
    name: Coverage, static analysis and documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 cppcheck doxygen
          python3 -m pip install clang-format==18.1.8
      - name: Formatting and static analysis
        run: python3 tools/quality.py
      - name: Configure coverage
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_COVERAGE=ON -DCMAKE_CXX_COMPILER=clang++-18
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test and enforce coverage above 90 percent
        env:
          LLVM_COV: llvm-cov-18
          LLVM_PROFDATA: llvm-profdata-18
        run: |
          python3 tools/coverage.py --build-dir build
          python3 tools/coverage.py --build-dir build --unit-only
      - name: Generate documentation and archive
        run: |
          cmake --build build --target docs
          tar -czf build/lab1-docs.tar.gz -C build/docs html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            build/coverage/report.json
            build/coverage/html
            build/unit-coverage/report.json
            build/unit-coverage/html
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: release-docs
          path: build/lab1-docs.tar.gz
          if-no-files-found: error

  release:
    name: Publish verified release packages
    needs: [build, quality]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/lab1-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz --verify-tag --title "$RELEASE_TAG" --generate-notes
